# Fork-only test build: builds GridCraft for macOS and Windows from any branch, tag or commit and
# publishes both as one GitHub pre-release on this fork. Not signed for distribution:
# - macOS: ad-hoc signed, not notarized. On the Mac, open it with right-click › Open, or run
#   `xattr -dr com.apple.quarantine GridCraft.app`.
# - Windows: unsigned. SmartScreen asks first (More info › Run anyway). The portable zip has the
#   Office.js library next to the app; the MSI doesn't, so use the zip for Office add-ins.
#
# Run: Actions › "Test build (macOS and Windows)" › Run workflow, or
#   gh workflow run macos-test-build.yml -R sirmmo/gridcraft -f ref=feat/plugin-host
# (the file keeps its old name so existing commands and links still work).
name: Test build (macOS and Windows)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        type: string
        default: main
      platforms:
        description: "Which platforms to build"
        type: choice
        options: [both, macos, windows]
        default: both
      arch:
        description: "macOS: aarch64 (Apple silicon), x86_64 (Intel) or universal (both, slower). Windows is always x64"
        type: choice
        options: [aarch64, universal, x86_64]
        default: aarch64

permissions:
  contents: write

concurrency:
  group: test-build-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  meta:
    # Upstream has its own signed release workflows; this one is for the fork.
    if: github.repository == 'sirmmo/gridcraft'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      commit: ${{ steps.meta.outputs.commit }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Version and tag
        id: meta
        env:
          REF: ${{ inputs.ref }}
          ARCH: ${{ inputs.arch }}
        run: |
          base="$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)"
          slug="$(printf '%s' "$REF" | tr -c 'A-Za-z0-9.\n' '-' | sed 's/-*$//')"
          if [ "$ARCH" = universal ]; then targets=aarch64-apple-darwin,x86_64-apple-darwin; else targets="$ARCH-apple-darwin"; fi
          {
            echo "version=$base-test.$GITHUB_RUN_NUMBER"
            echo "tag=test-$slug-$GITHUB_RUN_NUMBER"
            echo "sha=$(git rev-parse --short=8 HEAD)"
            echo "commit=$(git rev-parse HEAD)"
            echo "targets=$targets"
          } >>"$GITHUB_OUTPUT"

  macos:
    needs: meta
    if: inputs.platforms != 'windows'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.commit }}

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ needs.meta.outputs.targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-test-${{ inputs.arch }}

      # Branches with Office add-ins also build their Office.js library (wasm), which
      # package.sh puts in the app bundle's Resources.
      - name: Office.js library
        if: hashFiles('crates/office-js/Cargo.toml') != ''
        run: |
          rustup target add wasm32-unknown-unknown
          ver="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[" ]/,"",$0); sub(/version=/,"",$0); print; exit}' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$ver" --locked
          cargo xtask office-js

      - name: Build and package (ad-hoc signed)
        env:
          GRIDCRAFT_VERSION: ${{ needs.meta.outputs.version }}
        run: packaging/macos/package.sh --arch "${{ inputs.arch }}"

      # Branches with the plugin host also ship the example add-in, ready to load from the
      # Add-ins window (or `--plugin`).
      - name: Example add-in
        if: hashFiles('crates/plugin/src/bin/example_plugin.rs') != ''
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          ARCH: ${{ inputs.arch }}
          TARGETS: ${{ needs.meta.outputs.targets }}
        run: |
          inputs=()
          for t in ${TARGETS//,/ }; do
            cargo build --release --locked -p gridcraft-plugin --bin gridcraft-example-plugin --target "$t"
            inputs+=("target/$t/release/gridcraft-example-plugin")
          done
          dir="target/example-plugin/example"
          mkdir -p "$dir"
          lipo -create -output "$dir/gridcraft-example-plugin" "${inputs[@]}"
          codesign --force --sign - "$dir/gridcraft-example-plugin"
          "$dir/gridcraft-example-plugin" --manifest \
            | jq '.run.command = "./gridcraft-example-plugin"' >"$dir/plugin.json"
          (cd target/example-plugin && ditto -c -k --keepParent example "$GITHUB_WORKSPACE/dist/release/gridcraft-example-plugin-$VERSION-macos-$ARCH.zip")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    needs: meta
    if: inputs.platforms != 'macos'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.commit }}

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-test-x64

      - name: Office.js library
        if: hashFiles('crates/office-js/Cargo.toml') != ''
        run: |
          rustup target add wasm32-unknown-unknown
          ver="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[" ]/,"",$0); sub(/version=/,"",$0); print; exit}' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$ver" --locked
          cargo xtask office-js

      - name: WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build and package (unsigned)
        shell: pwsh
        env:
          GRIDCRAFT_VERSION: ${{ needs.meta.outputs.version }}
        run: ./packaging/windows/package.ps1 -Arch x64

      # The apps look for `office-js` next to the executable: add it to the portable zip.
      - name: Office.js library in the portable zip
        if: hashFiles('target/office-js/office_js_bg.wasm') != ''
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $zip = "dist/release/gridcraft-$env:VERSION-windows-x64-portable.zip"
          $dir = "target/portable-office"
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $dir
          $root = Get-ChildItem $dir -Recurse -Filter 'gridcraft.exe' | Select-Object -First 1
          if (-not $root) { throw "gridcraft.exe not found in $zip" }
          Copy-Item -Recurse "target/office-js" (Join-Path $root.DirectoryName 'office-js')
          Remove-Item $zip
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip

      - name: Example add-in
        if: hashFiles('crates/plugin/src/bin/example_plugin.rs') != ''
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cargo build --release --locked -p gridcraft-plugin --bin gridcraft-example-plugin --target x86_64-pc-windows-msvc
          dir="target/example-plugin/example"
          mkdir -p "$dir"
          cp "target/x86_64-pc-windows-msvc/release/gridcraft-example-plugin.exe" "$dir/"
          "$dir/gridcraft-example-plugin.exe" --manifest \
            | jq '.run.command = "./gridcraft-example-plugin.exe"' >"$dir/plugin.json"
          pwsh -NoProfile -Command "Compress-Archive -Path target/example-plugin/example -DestinationPath dist/release/gridcraft-example-plugin-$VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [meta, macos, windows]
    # Publish what built, as long as nothing that was asked for failed.
    if: always() && needs.meta.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          REF: ${{ inputs.ref }}
          SHA: ${{ needs.meta.outputs.sha }}
          COMMIT: ${{ needs.meta.outputs.commit }}
          PLATFORMS: ${{ inputs.platforms }}
          ARCH: ${{ inputs.arch }}
        run: |
          cat >notes.md <<EOF
          Test build of \`$REF\` ($SHA): $PLATFORMS (macOS $ARCH, Windows x64). Not for distribution.

          **macOS:** ad-hoc signed, not notarized. After copying GridCraft.app to Applications, run
          \`xattr -dr com.apple.quarantine /Applications/GridCraft.app\` (or right-click › Open).
          Do the same for \`gridcraft-cli\` and the example add-in folder.

          **Windows:** unsigned; SmartScreen asks first (More info › Run anyway). Use the
          portable zip for Office add-ins: it has the Office.js library next to gridcraft.exe, the
          MSI doesn't. Test MSIs share one version number, so uninstall the previous one first.
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" --prerelease --title "Test $VERSION ($REF)" --notes-file notes.md
