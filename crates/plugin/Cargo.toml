[package]
name = "gridcraft-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft plugin host: out-of-process plugins over JSON-RPC (custom functions and commands), installed from folders or GitHub"

[lints]
workspace = true

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-calc = { workspace = true }
gridcraft-collab = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }

# Installing plugins from GitHub (desktop and CLI; the web build can't run plugins).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

# A reference plugin written in Rust; the tests drive it as a real child process.
[[bin]]
name = "gridcraft-example-plugin"
path = "src/bin/example_plugin.rs"
test = false
doc = false

[dev-dependencies]
gridcraft-model = { workspace = true }

# Real-process cancellation/deadline fixtures run without external Python.
[[test]]
name = "macro_control"
path = "tests/macro_control.rs"
harness = false
